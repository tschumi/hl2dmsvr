// Executed ONCE at server start (by start.sh), not on map change.
// Changes to these settings via rcon therefore persist until the server restarts.
// Values from environment variables (env.cfg, generated by start.sh) override these defaults.
hostname "HL2DM Server"
sv_password ""                            // Server password for players to join (empty to disable)
sv_downloadurl ""                         // Location from which clients can download missing files
mp_winlimit 0                             // Rounds won before map change (0 = off)
